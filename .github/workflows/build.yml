name: Build ZMK firmware
# push only on main: a PR branch already builds through pull_request, so a push to it would
# build it twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85 # main as of 2026-10-09
