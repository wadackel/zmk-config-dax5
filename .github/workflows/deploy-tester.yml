name: Deploy Tester to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - uses: jdx/mise-action@v5.2.4

      - uses: actions/setup-node@v4.4.0
        with:
          cache: pnpm
          cache-dependency-path: tools/tester/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tools/tester
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: tools/tester
        env:
          BASE_PATH: /zmk-config-dax5/
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: tools/tester/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
