CONFIG_ZMK_KEYBOARD_NAME="dax5"

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# BLE信号強度向上: 左右対称性維持（左側エンコーダー操作性改善に合わせた設定）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_BAS=y

CONFIG_SPI=y
CONFIG_INPUT=y

# Enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_PAW3222=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y

CONFIG_ZMK_POINTING=y

# Encoder bindings edited at runtime (zmk-dax-modules' dax_encoder)
CONFIG_ZMK_DAX_ENCODER=y

# The stock 25-byte custom payload limit is below a dax settings write (owner,
# key, slot and value), and a page of listed settings needs more RPC thread
# stack than the default.
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# Trackball processors, combos and macros, kept in zmk-dax-modules' own settings layer
CONFIG_ZMK_DAX_POINTER=y
CONFIG_ZMK_DAX_COMBO=y
CONFIG_ZMK_DAX_COMBO_STUDIO_RPC=y
CONFIG_ZMK_DAX_MACRO=y
CONFIG_ZMK_DAX_MACRO_STUDIO_RPC=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Trackball CPI as a runtime setting (zmk-dax-modules)
CONFIG_ZMK_TRACKBALL_SETTINGS=y

# Reboot over custom Studio RPC (zmk-dax-modules), so daxial's `pnpm flash` copies a new firmware
# on without the bootloader key
CONFIG_ZMK_DAX_SYSTEM_RPC=y
